[project]
name = "clearbed"
version = "0.1.0"
description = "Discharge-barrier prediction and placement copilot for hospital case managers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
core = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pgeocode>=0.4",
    "numpy>=1.26",
    "dbt-core>=1.8,<1.11",
    "dbt-duckdb>=1.8,<1.11",
]
ml = [
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "joblib>=1.4",
]
agent = [
    "langgraph>=0.2.40",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-aws>=0.2",
    "langchain-groq>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
ui = [
    "streamlit>=1.39",
    "pydeck>=0.9",
    "folium>=0.17",
    "requests>=2.32",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]

[tool.uv]
default-groups = ["core", "ml", "agent", "api", "ui", "dev"]
package = true

# CPU wheels. The default PyPI torch build pulls multi-gigabyte CUDA libraries
# that this demo does not use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearbed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
packages = ["clearbed"]
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*", "app.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
