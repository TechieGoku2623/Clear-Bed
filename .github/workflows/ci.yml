name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Ruff
        run: |
          uv run ruff check src tests app
          uv run ruff format --check src tests app
      - name: Mypy
        run: uv run mypy src tests app
      - name: Pytest
        run: uv run pytest
      - name: Fixture warehouse
        run: make dbt-fixture
      - name: Agent eval
        run: make eval
